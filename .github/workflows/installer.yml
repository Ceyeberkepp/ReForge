name: installer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'install.sh'
      - '.env.example'
      - 'infra/docker-compose.yml'
      - '.github/workflows/installer.yml'
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - '.env.example'
      - 'infra/docker-compose.yml'
      - '.github/workflows/installer.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax
        run: bash -n install.sh
      - name: Verify preflight precedes host mutations
        run: |
          set -euo pipefail
          preflight_line="$(grep -n '^ROOT=' install.sh | head -1 | cut -d: -f1)"
          apt_line="$(grep -n '^apt-get update' install.sh | head -1 | cut -d: -f1)"
          docker_line="$(grep -n '^systemctl enable --now docker' install.sh | head -1 | cut -d: -f1)"
          test -n "$preflight_line" && test -n "$apt_line" && test -n "$docker_line"
          test "$preflight_line" -lt "$apt_line"
          test "$preflight_line" -lt "$docker_line"
          awk 'BEGIN{copy=0} /^ROOT=/{copy=1} copy && $0 == "echo \"[1/6] Installing base system dependencies...\"" {exit} copy{print}' install.sh > /tmp/reforge-preflight-order.sh
          test -s /tmp/reforge-preflight-order.sh
          if REFORGE_ROOT=/ bash /tmp/reforge-preflight-order.sh; then
            echo "Unsafe install root unexpectedly accepted" >&2
            exit 1
          fi
      - name: Verify source-copy does not replace deployed secrets
        run: |
          set -euo pipefail
          src="$(mktemp -d)"
          dest="$(mktemp -d)"
          trap 'rm -rf "$src" "$dest"' EXIT
          printf 'REFORGE_WORKER_TOKEN=checkout-secret\n' > "$src/.env"
          printf 'REFORGE_WORKER_TOKEN=production-secret\n' > "$dest/.env"
          mkdir -p "$src/infra"
          printf 'new compose content\n' > "$src/infra/docker-compose.yml"
          (cd "$src" && tar --exclude='./.env' --exclude='./.git' -cf - .) | tar -C "$dest" -xf -
          grep -qx 'REFORGE_WORKER_TOKEN=production-secret' "$dest/.env"
          grep -qx 'new compose content' "$dest/infra/docker-compose.yml"
      - name: Reject unsafe or incomplete upgrades before source copy
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          # Exercise the exact preflight code from install.sh, without apt or Docker.
          awk 'BEGIN{copy=0} /^ROOT="/{copy=1} copy && $0 == "if [[ -f \"./infra/docker-compose.yml\" ]]; then" {exit} copy{print}' install.sh > /tmp/reforge-preflight.sh
          test -s /tmp/reforge-preflight.sh
          printf 'REFORGE_WORKER_TOKEN=old-token\n' > "$root/.env"
          chmod 600 "$root/.env"
          if REFORGE_ROOT="$root" bash /tmp/reforge-preflight.sh; then
            echo "Incomplete production credentials unexpectedly accepted" >&2
            exit 1
          fi
          printf 'REFORGE_DB_DSN=postgres://existing\n' >> "$root/.env"
          REFORGE_ROOT="$root" bash /tmp/reforge-preflight.sh
          rm "$root/.env"
          ln -s /etc/passwd "$root/.env"
          if REFORGE_ROOT="$root" bash /tmp/reforge-preflight.sh; then
            echo "Symlinked credentials unexpectedly accepted" >&2
            exit 1
          fi
          if REFORGE_ROOT=/ bash /tmp/reforge-preflight.sh; then
            echo "Root filesystem unexpectedly accepted" >&2
            exit 1
          fi
      - name: Reject nonregular credential paths without blocking
        run: |
          set -euo pipefail
          awk 'BEGIN{copy=0} /^ROOT="/{copy=1} copy && $0 == "if [[ -f \"./infra/docker-compose.yml\" ]]; then" {exit} copy{print}' install.sh > /tmp/reforge-filetype-preflight.sh
          test -s /tmp/reforge-filetype-preflight.sh
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          # Identify the destination as an existing deployment so the unrelated
          # populated-directory guard cannot mask the file-type check.
          mkdir -p "$root/infra"
          touch "$root/infra/docker-compose.yml"
          mkfifo "$root/.env"
          if timeout 5 env REFORGE_ROOT="$root" bash /tmp/reforge-filetype-preflight.sh 2>"$root/err"; then
            echo "FIFO credential path unexpectedly accepted" >&2
            exit 1
          else
            code=$?
            test "$code" -ne 124
            grep -q 'Existing .env must be a regular credential file' "$root/err"
          fi
          rm "$root/.env"
          mkdir "$root/.env"
          if timeout 5 env REFORGE_ROOT="$root" bash /tmp/reforge-filetype-preflight.sh 2>"$root/err"; then
            echo "Directory credential path unexpectedly accepted" >&2
            exit 1
          else
            code=$?
            test "$code" -ne 124
            grep -q 'Existing .env must be a regular credential file' "$root/err"
          fi
          rmdir "$root/.env"
          printf 'REFORGE_WORKER_TOKEN=original\nREFORGE_DB_DSN=original-dsn\n' > "$root/.env"
          chmod 600 "$root/.env"
          REFORGE_ROOT="$root" bash /tmp/reforge-filetype-preflight.sh
          grep -qx 'REFORGE_WORKER_TOKEN=original' "$root/.env"
          grep -qx 'REFORGE_DB_DSN=original-dsn' "$root/.env"
      - name: Reject hardlinked credentials without altering linked file
        run: |
          set -euo pipefail
          awk 'BEGIN{copy=0} /^ROOT="/{copy=1} copy && $0 == "if [[ -f \"./infra/docker-compose.yml\" ]]; then" {exit} copy{print}' install.sh > /tmp/reforge-hardlink-preflight.sh
          test -s /tmp/reforge-hardlink-preflight.sh
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/infra"
          touch "$root/infra/docker-compose.yml"
          printf 'REFORGE_WORKER_TOKEN=original\nREFORGE_DB_DSN=original-dsn\n' > "$root/other-credentials"
          ln "$root/other-credentials" "$root/.env"
          if REFORGE_ROOT="$root" bash /tmp/reforge-hardlink-preflight.sh 2>"$root/err"; then
            echo "Hardlinked credentials unexpectedly accepted" >&2
            exit 1
          fi
          grep -q 'Existing .env must not be hardlinked' "$root/err"
          test "$(stat -c %h "$root/.env")" -eq 2
          grep -qx 'REFORGE_WORKER_TOKEN=original' "$root/other-credentials"
          grep -qx 'REFORGE_DB_DSN=original-dsn' "$root/other-credentials"
          rm "$root/.env"
          printf 'REFORGE_WORKER_TOKEN=original\nREFORGE_DB_DSN=original-dsn\n' > "$root/.env"
          chmod 600 "$root/.env"
          REFORGE_ROOT="$root" bash /tmp/reforge-hardlink-preflight.sh
      - name: Reject exposed production credentials without changing them
        run: |
          set -euo pipefail
          awk 'BEGIN{copy=0} /^ROOT="/{copy=1} copy && $0 == "if [[ -f \"./infra/docker-compose.yml\" ]]; then" {exit} copy{print}' install.sh > /tmp/reforge-private-env-preflight.sh
          test -s /tmp/reforge-private-env-preflight.sh
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/infra"
          touch "$root/infra/docker-compose.yml"
          printf 'REFORGE_WORKER_TOKEN=original\nREFORGE_DB_DSN=original-dsn\n' > "$root/.env"
          chmod 644 "$root/.env"
          if REFORGE_ROOT="$root" bash /tmp/reforge-private-env-preflight.sh 2>"$root/err"; then
            echo "World-readable production credentials unexpectedly accepted" >&2
            exit 1
          fi
          grep -q 'Existing .env permissions expose credentials' "$root/err"
          test "$(stat -c %a "$root/.env")" = 644
          grep -qx 'REFORGE_WORKER_TOKEN=original' "$root/.env"
          grep -qx 'REFORGE_DB_DSN=original-dsn' "$root/.env"
          chmod 640 "$root/.env"
          if REFORGE_ROOT="$root" bash /tmp/reforge-private-env-preflight.sh 2>"$root/err"; then
            echo "Group-readable production credentials unexpectedly accepted" >&2
            exit 1
          fi
          grep -q 'Existing .env permissions expose credentials' "$root/err"
          chmod 600 "$root/.env"
          REFORGE_ROOT="$root" bash /tmp/reforge-private-env-preflight.sh
      - name: Reject ambiguous persisted credentials before mutation
        run: |
          set -euo pipefail
          awk 'BEGIN{copy=0} /^ROOT="/{copy=1} copy && $0 == "if [[ -f \"./infra/docker-compose.yml\" ]]; then" {exit} copy{print}' install.sh > /tmp/reforge-credential-preflight.sh
          test -s /tmp/reforge-credential-preflight.sh
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          printf 'REFORGE_WORKER_TOKEN=original\nREFORGE_DB_DSN=original-dsn\n' > "$root/.env"
          chmod 600 "$root/.env"
          REFORGE_ROOT="$root" bash /tmp/reforge-credential-preflight.sh
          for key in REFORGE_WORKER_TOKEN REFORGE_DB_DSN; do
            printf '%s=conflicting\n' "$key" >> "$root/.env"
            if REFORGE_ROOT="$root" bash /tmp/reforge-credential-preflight.sh; then
              echo "Duplicate $key unexpectedly accepted" >&2
              exit 1
            fi
            sed -i '$d' "$root/.env"
          done
          grep -qx 'REFORGE_WORKER_TOKEN=original' "$root/.env"
          grep -qx 'REFORGE_DB_DSN=original-dsn' "$root/.env"
      - name: Reject redirected or relative install roots
        run: |
          set -euo pipefail
          real_root="$(mktemp -d)"
          link_root="${real_root}-link"
          trap 'rm -f "$link_root"; rm -rf "$real_root"' EXIT
          awk 'BEGIN{copy=0} /^ROOT="/{copy=1} copy && $0 == "if [[ -f \"./infra/docker-compose.yml\" ]]; then" {exit} copy{print}' install.sh > /tmp/reforge-root-preflight.sh
          ln -s "$real_root" "$link_root"
          if REFORGE_ROOT="$link_root" bash /tmp/reforge-root-preflight.sh; then
            echo "Symlinked install root unexpectedly accepted" >&2
            exit 1
          fi
          if REFORGE_ROOT=relative/reforge bash /tmp/reforge-root-preflight.sh; then
            echo "Relative install root unexpectedly accepted" >&2
            exit 1
          fi
          # A symlinked parent was not rejected by the previous leaf-only check.
          parent="$(mktemp -d)"
          mkdir -p "$parent/real"
          ln -s "$parent/real" "$parent/redirect"
          trap 'rm -f "$link_root"; rm -rf "$real_root" "$parent"' EXIT
          if REFORGE_ROOT="$parent/redirect/reforge" bash /tmp/reforge-root-preflight.sh; then
            echo "Symlinked parent unexpectedly accepted" >&2
            exit 1
          fi
          if REFORGE_ROOT="$parent/real/../reforge" bash /tmp/reforge-root-preflight.sh; then
            echo "Traversal path unexpectedly accepted" >&2
            exit 1
          fi
          REFORGE_ROOT="$real_root" bash /tmp/reforge-root-preflight.sh
      - name: Reject missing deployed secrets and unrelated populated targets
        run: |
          set -euo pipefail
          awk 'BEGIN{copy=0} /^ROOT="/{copy=1} copy && $0 == "if [[ -f \"./infra/docker-compose.yml\" ]]; then" {exit} copy{print}' install.sh > /tmp/reforge-missing-env-preflight.sh
          test -s /tmp/reforge-missing-env-preflight.sh
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          mkdir -p "$root/infra"
          printf 'services: {}\n' > "$root/infra/docker-compose.yml"
          if REFORGE_ROOT="$root" bash /tmp/reforge-missing-env-preflight.sh; then
            echo "Existing deployment without .env unexpectedly accepted" >&2
            exit 1
          fi
          printf 'REFORGE_WORKER_TOKEN=existing-token\nREFORGE_DB_DSN=existing-dsn\n' > "$root/.env"
          chmod 600 "$root/.env"
          REFORGE_ROOT="$root" bash /tmp/reforge-missing-env-preflight.sh
          rm -rf "$root/infra" "$root/.env"
          printf 'unrelated content\n' > "$root/important.txt"
          mkdir -p infra
          if REFORGE_ROOT="$root" bash /tmp/reforge-missing-env-preflight.sh; then
            echo "Unrelated populated target unexpectedly accepted" >&2
            exit 1
          fi
          rm "$root/important.txt"
          REFORGE_ROOT="$root" bash /tmp/reforge-missing-env-preflight.sh
      - name: Reject invalid web ports before deployment mutation
        run: |
          set -euo pipefail
          # Run the installer's exact preflight segment without apt, Docker or file copy.
          awk 'BEGIN{copy=0} /^ROOT="/{copy=1} copy && $0 == "if [[ -f \"./infra/docker-compose.yml\" ]]; then" {exit} copy{print}' install.sh > /tmp/reforge-port-preflight.sh
          test -s /tmp/reforge-port-preflight.sh
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          for port in 0 80 1023 65536 9999999999999999999999999999 08080 abc 1234x; do
            if REFORGE_ROOT="$root" REFORGE_WEB_PORT="$port" bash /tmp/reforge-port-preflight.sh; then
              echo "Invalid port accepted: $port" >&2
              exit 1
            fi
            test "$(find "$root" -mindepth 1 -maxdepth 1 | wc -l)" -eq 0
          done
          for port in 1024 5173 65535; do
            REFORGE_ROOT="$root" REFORGE_WEB_PORT="$port" bash /tmp/reforge-port-preflight.sh
          done
          # Upgrade preflight must not replace or reject persisted settings.
          printf 'REFORGE_WORKER_TOKEN=existing\nREFORGE_DB_DSN=existing\nREFORGE_WEB_PORT=5173\n' > "$root/.env"
          chmod 600 "$root/.env"
          REFORGE_ROOT="$root" REFORGE_WEB_PORT=invalid bash /tmp/reforge-port-preflight.sh
          grep -qx 'REFORGE_WEB_PORT=5173' "$root/.env"
          for bad_port in 80 65536 abc 08080; do
            sed -i "s/^REFORGE_WEB_PORT=.*/REFORGE_WEB_PORT=${bad_port}/" "$root/.env"
            if REFORGE_ROOT="$root" bash /tmp/reforge-port-preflight.sh; then
              echo "Invalid persisted port accepted: $bad_port" >&2
              exit 1
            fi
          done
          sed -i 's/^REFORGE_WEB_PORT=.*/REFORGE_WEB_PORT=5173/' "$root/.env"
          REFORGE_ROOT="$root" bash /tmp/reforge-port-preflight.sh
          # Conflicting duplicate dotenv keys must fail before host changes.
          printf 'REFORGE_WEB_PORT=5174\n' >> "$root/.env"
          if REFORGE_ROOT="$root" bash /tmp/reforge-port-preflight.sh; then
            echo 'Duplicate persisted REFORGE_WEB_PORT keys accepted' >&2
            exit 1
          fi
          test "$(grep -c '^REFORGE_WEB_PORT=' "$root/.env")" -eq 2
      - name: Verify unattended database selection
        run: |
          set -euo pipefail
          # Exercise the exact selection block without invoking apt or Docker.
          sed -n '/^DB_CHOICE="/,/^DBPASS="/p' install.sh | sed '$d' > /tmp/reforge-db-choice.sh
          test -s /tmp/reforge-db-choice.sh
          test "$(REFORGE_NONINTERACTIVE=1 bash -c 'source /tmp/reforge-db-choice.sh; echo "$DB_CHOICE"' </dev/null)" = "1"
          test "$(REFORGE_DB_CHOICE=2 REFORGE_NONINTERACTIVE=1 bash -c 'source /tmp/reforge-db-choice.sh; echo "$DB_CHOICE"' </dev/null)" = "2"
          test "$(bash -c 'source /tmp/reforge-db-choice.sh; echo "$DB_CHOICE"' </dev/null)" = "1"
      - name: Verify optional services never prompt without a terminal
        run: |
          set -euo pipefail
          sed -n '/^ENABLE_MONGO="/,/^cat > .env <<EOF/p' install.sh | sed '$d' > /tmp/reforge-optional-services.sh
          test -s /tmp/reforge-optional-services.sh
          # /dev/null represents a noninteractive one-click installation.
          timeout 5 bash -c 'source /tmp/reforge-optional-services.sh; test -z "$PROFILE"' </dev/null
          timeout 5 env REFORGE_ENABLE_MONGODB=yes REFORGE_ENABLE_NEO4J=1 bash -c 'source /tmp/reforge-optional-services.sh; test "$PROFILE" = ",mongodb,neo4j"' </dev/null
          timeout 5 env REFORGE_NONINTERACTIVE=1 bash -c 'source /tmp/reforge-optional-services.sh; test -z "$PROFILE"' </dev/null
      - name: Reject invalid optional-service selections
        run: |
          set -euo pipefail
          sed -n '/^ENABLE_MONGO="/,/^cat > .env <<EOF/p' install.sh | sed '$d' > /tmp/reforge-options-validation.sh
          test -s /tmp/reforge-options-validation.sh
          env PROFILE="" REFORGE_ENABLE_MONGODB=yes REFORGE_ENABLE_NEO4J=no bash -c 'source /tmp/reforge-options-validation.sh; test "$PROFILE" = ",mongodb"' </dev/null
          if env PROFILE="" REFORGE_ENABLE_MONGODB=yees bash -c 'source /tmp/reforge-options-validation.sh' </dev/null; then
            echo "Invalid MongoDB choice unexpectedly accepted" >&2
            exit 1
          fi
          if env PROFILE="" REFORGE_ENABLE_NEO4J=maybe bash -c 'source /tmp/reforge-options-validation.sh' </dev/null; then
            echo "Invalid Neo4j choice unexpectedly accepted" >&2
            exit 1
          fi
      - name: Verify explicit optional-service selections are never prompted again
        run: |
          set -euo pipefail
          sed -n '/^ENABLE_MONGO="/,/^cat > .env <<EOF/p' install.sh | sed '$d' > /tmp/reforge-options.sh
          test -s /tmp/reforge-options.sh
          # With both choices explicit, even a TTY must not cause a read.
          # 'script' provides a pseudo-terminal, and timeout detects hanging prompts.
          printf '%s\n' 'PROFILE=""' 'source /tmp/reforge-options.sh' 'test "$PROFILE" = ",mongodb"' > /tmp/reforge-tty-check.sh
          timeout 5 script -q -e -c "env REFORGE_ENABLE_MONGODB=yes REFORGE_ENABLE_NEO4J=no bash /tmp/reforge-tty-check.sh" /dev/null
      - name: Verify installer never recursively deletes installation root
        run: |
          set -euo pipefail
          # Guard the fresh-clone path against reintroducing destructive cleanup.
          ! grep -Eq '^[[:space:]]*rm[[:space:]]+-[a-zA-Z]*r[a-zA-Z]*[[:space:]]+"?\$\{ROOT\}' install.sh
          # Git supports cloning into an existing empty destination.
          src="$(mktemp -d)"
          dest="$(mktemp -d)"
          trap 'rm -rf "$src" "$dest"' EXIT
          git -C "$src" init -q
          git -C "$src" -c user.name=CI -c user.email=ci@example.invalid commit --allow-empty -qm initial
          git clone -q "$src" "$dest"
          test -d "$dest/.git"
      - name: Installer refuses failed SQL initialization and unhealthy API
        run: |
          set -euo pipefail
          bash -n install.sh
          # SQL readiness is explicitly gated after the retry loop.
          sed -n '/^  SQLSERVER_READY=false$/,/^  if \[\[ "\$SQLSERVER_READY" != true \]\]; then$/p' install.sh | grep -q 'SQLSERVER_READY=true'
          grep -q 'SQL Server database initialization did not succeed' install.sh
          # Extract the actual readiness block to exercise fail-closed behavior.
          sed -n '/^HEALTH_READY=false$/,/^if \[\[ "\$HEALTH_READY" != true \]\]; then$/p' install.sh | sed '$d' > /tmp/reforge-health-loop.sh
          test -s /tmp/reforge-health-loop.sh
          # All requests should fail quickly: test harness overrides curl and sleep.
          cat > /tmp/reforge-health-test.sh <<'EOF'
          set -euo pipefail
          WEB_PORT=5173
          curl() { return 7; }
          sleep() { :; }
          source /tmp/reforge-health-loop.sh
          test "$HEALTH_READY" = false
          EOF
          bash /tmp/reforge-health-test.sh
          # A correct health response causes successful early termination.
          sed -i 's/curl() { return 7; }/curl() { printf "{\\"status\\":\\"ok\\"}"; }/' /tmp/reforge-health-test.sh
          sed -i 's/test "\$HEALTH_READY" = false/test "\$HEALTH_READY" = true/' /tmp/reforge-health-test.sh
          bash /tmp/reforge-health-test.sh
      - name: Compose configuration
        run: docker compose --env-file .env.example -f infra/docker-compose.yml config --quiet
      - name: Check overridable web port
        run: |
          docker compose --env-file .env.example -f infra/docker-compose.yml config > /tmp/reforge-default.yml
          REFORGE_WEB_PORT=5174 docker compose --env-file .env.example -f infra/docker-compose.yml config > /tmp/reforge-custom.yml
          grep -q 'published: "5174"' /tmp/reforge-custom.yml
