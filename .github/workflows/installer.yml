name: installer
on:
  pull_request:
    paths:
      - 'install.sh'
      - 'infra/docker-compose.yml'
      - '.github/workflows/installer.yml'
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'infra/docker-compose.yml'
      - '.github/workflows/installer.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n install.sh
      - name: Verify source-copy does not replace deployed secrets
        run: |
          set -euo pipefail
          src="$(mktemp -d)"
          dest="$(mktemp -d)"
          trap 'rm -rf "$src" "$dest"' EXIT
          printf 'REFORGE_WORKER_TOKEN=checkout-secret\\n' > "$src/.env"
          printf 'REFORGE_WORKER_TOKEN=production-secret\\n' > "$dest/.env"
          mkdir -p "$src/infra"
          printf 'new compose content\\n' > "$src/infra/docker-compose.yml"
          (cd "$src" && tar --exclude='./.env' --exclude='./.git' -cf - .) | tar -C "$dest" -xf -
          grep -qx 'REFORGE_WORKER_TOKEN=production-secret' "$dest/.env"
          grep -qx 'new compose content' "$dest/infra/docker-compose.yml"
      - name: Compose configuration
        run: docker compose --env-file .env.example -f infra/docker-compose.yml config --quiet
      - name: Check overridable web port
        run: |
          docker compose --env-file .env.example -f infra/docker-compose.yml config > /tmp/reforge-default.yml
          REFORGE_WEB_PORT=5174 docker compose --env-file .env.example -f infra/docker-compose.yml config > /tmp/reforge-custom.yml
          grep -q 'published: "5174"' /tmp/reforge-custom.yml
