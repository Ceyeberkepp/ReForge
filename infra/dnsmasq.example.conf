# Example only. Do not run a second DHCP server on a production network
# unless it is intentionally designed for that subnet.
#
# Proxy-DHCP style examples vary by environment. The preferred ReForge
# design is to keep the existing DHCP service and chain iPXE to:
#
#   http://REFORGE-SERVER:8080/boot/ipxe?api_url=http://REFORGE-SERVER:8080
#
# Common boot files:
# BIOS:     undionly.kpxe
# UEFI x64: ipxe.efi
#
# Example TFTP-only service:
port=0
enable-tftp
tftp-root=/srv/reforge/tftp
log-dhcp
