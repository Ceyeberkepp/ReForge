services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reforge}
      POSTGRES_USER: ${POSTGRES_USER:-reforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - reforge-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://reforge:change-me@db:5432/reforge}
    depends_on:
      - db
    ports:
      - "8080:8080"

  worker:
    build:
      context: ../apps/worker
    environment:
      REFORGE_API_URL: http://api:8080
      REFORGE_WORKER_POLL_SECONDS: 3
      REFORGE_EXECUTE_PRIVILEGED: "false"
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  reforge-db:
